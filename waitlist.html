<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdubbaX · Waitlist</title>
<meta name="description" content="EdubbaX pilotu üçün gözləmə siyahısı / Pilot waitlist / Pilot bekleme listesi">
<style>
:root{--bg:#080b14;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--tx:#f2f0ea;--mut:#aab0c4;--gold:#D4AF37;--ok:#3ecf8e;--err:#ff7b7b}
*{box-sizing:border-box}
html{background:#080b14}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 25% 0,#16213a,#080b14 62%) no-repeat;color:var(--tx);min-height:100vh;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.logo{font-family:Georgia,"DejaVu Serif",serif;font-size:30px;color:var(--gold);letter-spacing:-.5px}
.logo b{font-family:Inter,system-ui,sans-serif;color:#fff;font-weight:800}
.lang{display:flex;gap:6px}
.lang button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#1a1400;border-color:var(--gold)}
h1{font-size:clamp(28px,6.5vw,40px);line-height:1.12;margin:0 0 12px;letter-spacing:-.8px}
h1 span{color:var(--gold)}
.lead{color:var(--mut);margin:0 0 26px;font-size:17px}
form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
label small{font-weight:500;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
select option{color:#111}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:14.5px;color:var(--tx)}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--gold)}
.pilot{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.35);border-radius:14px;padding:12px 14px}
button.go{width:100%;margin-top:22px;border:0;border-radius:999px;background:var(--gold);color:#1a1400;font-weight:800;font-size:18px;padding:16px;cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:15px;min-height:22px}
.msg.err{color:var(--err)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:44px 22px;background:var(--card);border:1px solid var(--line);border-radius:22px}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#06281a;font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.done h2{margin:0 0 8px;font-size:26px}.done p{color:var(--mut);margin:0}
.foot{margin-top:22px;font-size:13px;color:var(--mut);text-align:center}
.foot a{color:var(--gold)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">edubba<b>X</b></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-l="az">AZ</button><button type="button" data-l="tr">TR</button><button type="button" data-l="en">EN</button>
    </div>
  </div>

  <div id="intro">
    <h1 id="t-h1"></h1>
    <p class="lead" id="t-lead"></p>
  </div>

  <form id="f" novalidate>
    <label for="name" id="l-name"></label>
    <input id="name" name="name" autocomplete="name" maxlength="100" required>

    <label for="email" id="l-email"></label>
    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>

    <label for="role" id="l-role"></label>
    <select id="role" name="role"></select>

    <div class="row">
      <div><label for="org" id="l-org"></label><input id="org" name="org" maxlength="120"></div>
      <div><label for="subject" id="l-subject"></label><input id="subject" name="subject" maxlength="120"></div>
    </div>

    <div class="row">
      <div><label for="students" id="l-students"></label><input id="students" name="students" type="number" min="0" max="100000" inputmode="numeric"></div>
      <div><label for="platform" id="l-platform"></label><input id="platform" name="platform" maxlength="80"></div>
    </div>

    <label for="problem" id="l-problem"></label>
    <textarea id="problem" name="problem" maxlength="1000"></textarea>

    <div class="check pilot"><input id="pilot" type="checkbox"><label for="pilot" id="l-pilot" style="margin:0;font-weight:600"></label></div>

    <div class="check"><input id="consent" type="checkbox"><label for="consent" id="l-consent" style="margin:0;font-weight:500"></label></div>

    <!-- honeypot: real people never see or fill this -->
    <div class="hp" aria-hidden="true"><label>Website<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>

    <button class="go" id="go" type="submit"></button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>

  <div class="done hidden" id="done">
    <div class="tick">✓</div>
    <h2 id="t-done-h"></h2>
    <p id="t-done-p"></p>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const T={
az:{h1:'EdubbaX <span>pilotu</span> üçün gözləmə siyahısı',lead:'Dərs bitməmiş şagirdlərin başa düşmədiyi yeri görmək istəyirsiniz? Pilot üçün müəllimlər və mərkəzlər axtarırıq. Qeydiyyatdan keçin, pilot başlayanda ilk sizə yazaq.',
 name:'Ad, soyad',email:'E-poçt',role:'Siz kimsiniz?',roles:{teacher:'Müəllim / repetitor',center:'Kurs və ya təhsil mərkəzi',parent:'Valideyn',other:'Digər'},
 org:'Məktəb / mərkəz <small>(istəyə bağlı)</small>',subject:'Fənn <small>(istəyə bağlı)</small>',students:'Təxmini şagird sayı <small>(istəyə bağlı)</small>',platform:'Dərsi hazırda harada keçirsiniz? <small>(Zoom, Meet, sinifdə…)</small>',
 problem:'Dərs zamanı ən böyük problem nədir? <small>(istəyə bağlı)</small>',pilot:'Pilotda 2–3 test dərsi keçməyə və qısa rəy verməyə hazıram.',
 consent:'Məlumatlarımın yalnız EdubbaX pilotu ilə bağlı mənimlə əlaqə saxlamaq üçün istifadə olunmasına razıyam.',
 go:'Gözləmə siyahısına qoşul',sending:'Göndərilir…',doneH:'Təşəkkür edirik!',doneP:'Qeydiyyatınız alındı. Pilot başlayanda sizinlə e-poçt vasitəsilə əlaqə saxlayacağıq.',
 eName:'Adınızı yazın.',eEmail:'E-poçt ünvanını düzgün yazın.',eConsent:'Davam etmək üçün razılıq vermək lazımdır.',eInvalid:'Məlumatlarda səhv var. Yoxlayıb yenidən cəhd edin.',eBusy:'Hazırda çox sorğu var. Bir az sonra yenidən cəhd edin.',eNet:'Göndərmək alınmadı. İnternetinizi yoxlayıb yenidən cəhd edin.',eCfg:'Bu səhifə hələ bazaya qoşulmayıb (config.js boşdur).',
 foot:'Prototip mərhələsi · <a href="mailto:edubbax@gmail.com">edubbax@gmail.com</a>'},
tr:{h1:'EdubbaX <span>pilotu</span> için bekleme listesi',lead:'Ders bitmeden öğrencilerin anlamadığı yeri görmek ister misiniz? Pilot için öğretmen ve merkezler arıyoruz. Kaydolun, pilot başlayınca ilk size yazalım.',
 name:'Ad, soyad',email:'E-posta',role:'Siz kimsiniz?',roles:{teacher:'Öğretmen / özel ders hocası',center:'Kurs veya eğitim merkezi',parent:'Veli',other:'Diğer'},
 org:'Okul / merkez <small>(isteğe bağlı)</small>',subject:'Ders <small>(isteğe bağlı)</small>',students:'Yaklaşık öğrenci sayısı <small>(isteğe bağlı)</small>',platform:'Dersi şu an nerede yapıyorsunuz? <small>(Zoom, Meet, sınıfta…)</small>',
 problem:'Ders sırasında en büyük sorununuz nedir? <small>(isteğe bağlı)</small>',pilot:'Pilotta 2–3 deneme dersi yapmaya ve kısa geri bildirim vermeye hazırım.',
 consent:'Verilerimin yalnızca EdubbaX pilotuyla ilgili benimle iletişim kurmak için kullanılmasını kabul ediyorum.',
 go:'Bekleme listesine katıl',sending:'Gönderiliyor…',doneH:'Teşekkürler!',doneP:'Kaydınız alındı. Pilot başlayınca sizinle e-posta yoluyla iletişime geçeceğiz.',
 eName:'Adınızı yazın.',eEmail:'E-posta adresini doğru yazın.',eConsent:'Devam etmek için onay vermeniz gerekir.',eInvalid:'Bilgilerde hata var. Kontrol edip tekrar deneyin.',eBusy:'Şu an çok fazla istek var. Biraz sonra tekrar deneyin.',eNet:'Gönderilemedi. İnternetinizi kontrol edip tekrar deneyin.',eCfg:'Bu sayfa henüz veritabanına bağlı değil (config.js boş).',
 foot:'Prototip aşaması · <a href="mailto:edubbax@gmail.com">edubbax@gmail.com</a>'},
en:{h1:'EdubbaX <span>pilot</span> waitlist',lead:'Want to see what students did not understand before the lesson ends? We are looking for teachers and centers for the pilot. Sign up and we will write to you first when it starts.',
 name:'Full name',email:'E-mail',role:'Who are you?',roles:{teacher:'Teacher / tutor',center:'Course or education center',parent:'Parent',other:'Other'},
 org:'School / center <small>(optional)</small>',subject:'Subject <small>(optional)</small>',students:'Approx. number of students <small>(optional)</small>',platform:'Where do you teach now? <small>(Zoom, Meet, in class…)</small>',
 problem:'What is your biggest problem during lessons? <small>(optional)</small>',pilot:'I can run 2–3 test lessons in the pilot and give short feedback.',
 consent:'I agree that my details are used only to contact me about the EdubbaX pilot.',
 go:'Join the waitlist',sending:'Sending…',doneH:'Thank you!',doneP:'You are on the list. We will contact you by e-mail when the pilot starts.',
 eName:'Please enter your name.',eEmail:'Please enter a valid e-mail address.',eConsent:'Please give your consent to continue.',eInvalid:'Some details look wrong. Please check and try again.',eBusy:'Too many requests right now. Please try again in a bit.',eNet:'Could not send. Check your connection and try again.',eCfg:'This page is not connected to the database yet (config.js is empty).',
 foot:'Prototype stage · <a href="mailto:edubbax@gmail.com">edubbax@gmail.com</a>'}
};
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
let lang=(qs.get('lang')||'').toLowerCase();
if(!T[lang]){const n=(navigator.language||'az').slice(0,2).toLowerCase();lang=T[n]?n:'az'}
const source=(qs.get('src')||'').replace(/[^\w.\-]/g,'').slice(0,60)||null;

function apply(){
  const s=T[lang];document.documentElement.lang=lang;
  $('t-h1').innerHTML=s.h1;$('t-lead').textContent=s.lead;
  ['name','email','role','org','subject','students','platform','problem','pilot','consent'].forEach(k=>{$('l-'+k).innerHTML=s[k]});
  const sel=$('role'),cur=sel.value;sel.innerHTML='';
  Object.keys(s.roles).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=s.roles[k];sel.appendChild(o)});
  if(cur)sel.value=cur;
  $('go').textContent=s.go;$('t-done-h').textContent=s.doneH;$('t-done-p').textContent=s.doneP;$('foot').innerHTML=s.foot;$('msg').textContent='';
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;apply()});
apply();

const cfg=window.EDUBBAX_CONFIG||{};
let sb=null;
try{if(cfg.supabaseUrl&&cfg.supabaseKey&&window.supabase)sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false}})}catch(e){sb=null}

function fail(t){const m=$('msg');m.className='msg err';m.textContent=t}
$('f').addEventListener('submit',async e=>{
  e.preventDefault();const s=T[lang];$('msg').className='msg';$('msg').textContent='';
  if($('website').value){ $('intro').classList.add('hidden');$('f').classList.add('hidden');$('done').classList.remove('hidden');return } // bots: pretend success, send nothing
  const name=$('name').value.trim(),email=$('email').value.trim();
  if(name.length<2)return fail(s.eName);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail(s.eEmail);
  if(!$('consent').checked)return fail(s.eConsent);
  if(!sb)return fail(s.eCfg);
  const st=$('students').value.trim();
  const btn=$('go');btn.disabled=true;btn.textContent=s.sending;
  try{
    const {data,error}=await sb.rpc('waitlist_join',{
      p_name:name,p_email:email,p_role:$('role').value,p_org:$('org').value,p_subject:$('subject').value,
      p_students:st===''?null:Math.max(0,Math.min(100000,parseInt(st,10)||0)),p_platform:$('platform').value,p_problem:$('problem').value,
      p_pilot:$('pilot').checked,p_lang:lang,p_consent:true,p_source:source});
    if(error)throw error;
    if(data==='ok'){$('intro').classList.add('hidden');$('f').classList.add('hidden');$('done').classList.remove('hidden');window.scrollTo({top:0})}
    else if(data==='busy')fail(s.eBusy);
    else if(data==='consent')fail(s.eConsent);
    else fail(s.eInvalid);
  }catch(err){fail(s.eNet)}
  finally{btn.disabled=false;btn.textContent=s.go}
});
</script>
</body>
</html>
