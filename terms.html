eb:'Hüquqi məlumat',h:'İstifadə şərtləri',p:'EdubbaX-dan istifadə etməklə bu şərtləri qəbul edirsiniz. Kursla ayrıca yazılı müqavilə bağlanıbsa və onun şərtləri fərqlidirsə, müqavilə üstünlük təşkil edir.',upd:'Son yenilənmə: 15 noyabr 2026',toc:'Mündəricat',
S:[
['Xidmət','<p>EdubbaX müəllimlər və tədris mərkəzləri üçün brauzerdə işləyən platformadır: dərs içi testlər, materialdan AI ilə sual hazırlanması, avtomatik nəticə, hesabatlar, valideyn hesabatı linki, mərkəz paneli və ödəniş uçotu. Xidməti EdubbaX layihəsi (təsisçi: Ömər Heydər) göstərir.</p>'],
['Pilot mərhələsi','<p>EdubbaX hazırda pilot mərhələsindədir. Funksiyalar dəyişə, yenisi əlavə oluna bilər. Xidməti fasiləsiz və xətasız işlətməyə çalışırıq, lakin pilot dövründə bunu tam zəmanət edə bilmirik. Planlı texniki işlər barədə əvvəlcədən xəbər veririk.</p>'],
['Hesablar','<ul><li>Hesabı yalnız müəllim və ya kursun səlahiyyətli əməkdaşı açır.</li><li>Giriş məlumatlarınızı başqası ilə paylaşmayın. Hesabınızla edilən hərəkətlərə görə siz məsuliyyət daşıyırsınız.</li><li>Mərkəz rəhbəri müəllimləri dəvət kodu ilə qoşur və onları mərkəzdən çıxara bilər.</li></ul>'],
['Kursun öhdəlikləri','<ul><li>şagird məlumatlarını EdubbaX-a yalnız qanuni əsasla əlavə etmək və valideynləri məlumatlandırmaq (bax: <a data-l="privacy.html" href="privacy.html">Məxfilik siyasəti</a>, 8-ci bənd);</li><li>sistemə başqasının müəllif hüququnu pozan material yükləməmək;</li><li>xidməti zərərli məqsədlə istifadə etməmək, sistemin təhlükəsizliyini sınamamaq və başqa istifadəçilərin məlumatına girməyə cəhd etməmək.</li></ul>'],
['Məlumatlar və material kimə məxsusdur','<p>Kursun daxil etdiyi şagird məlumatları, nəticələr və yüklədiyi materiallar kursa məxsusdur. EdubbaX onlardan yalnız xidməti göstərmək üçün istifadə edir. Kurs istənilən vaxt məlumatlarını ixrac edə bilər.</p><p>EdubbaX platforması, dizaynı, "İşıqlı Döngü" metodu, MLI göstəricisi və proqram kodu EdubbaX-a məxsusdur.</p>'],
['AI ilə hazırlanan suallar','<p>AI-nin hazırladığı suallar köməkçi vasitədir və səhv ola bilər. Sualları istifadədən əvvəl müəllim yoxlamalı və təsdiq etməlidir. Testin məzmununa görə son məsuliyyət müəllimin üzərindədir.</p>'],
['Qiymət və ödəniş','<ul><li>Qiymətlər <a data-l="courses.html#pricing" href="courses.html#pricing">Qiymətlər</a> bölməsində göstərilib və ƏDV-siz verilib.</li><li>Ödəniş aylıq qaimə əsasında bank köçürməsi ilə, qaimədən sonra 10 gün ərzində aparılır.</li><li>Aktiv şagird həmin ay ən azı bir yoxlamada iştirak edən şagirddir; hesab ay sonu bu sayla aparılır.</li><li>Ödəniş 15 gündən çox gecikərsə, e-poçtla xəbərdarlıq edilir. Xəbərdarlıqdan 7 gün sonra hesab yalnız oxuma rejiminə keçə bilər. Məlumatlar silinmir.</li><li>Qiymət dəyişəcəksə, kurslara ən azı 30 gün əvvəl xəbər verilir.</li></ul>'],
['Ödəniş uçotu bölməsi','<p>EdubbaX şagirdlərdən və valideynlərdən pul qəbul etmir, ödəniş göndərmir və bank və ya ödəniş xidməti deyil. Ödəniş bölməsi yalnız kursun öz qeydləri üçündür. Qeydlərin düzgünlüyünə görə kurs cavabdehdir.</p>'],
['Müqavilənin dayandırılması','<ul><li>Pilot dövründə kurs istənilən gün dayandıra bilər.</li><li>Pilotdan sonra kurs 30 gün əvvəl yazılı (e-poçtla) xəbər verməklə istənilən ay dayandıra bilər.</li><li>EdubbaX bu şərtlər ciddi pozularsa, xəbərdarlıqdan sonra hesabı dayandıra bilər.</li><li>Dayandırmadan sonra məlumatlar 30 gün ixrac üçün saxlanılır, sonra silinir.</li></ul>'],
['Məsuliyyətin həddi','<p>EdubbaX xidmətin istifadəsi nəticəsində yaranan dolayı zərərə (məsələn, gəlir itkisi) görə məsuliyyət daşımır. EdubbaX-ın ümumi məsuliyyəti kursun son 3 ayda EdubbaX-a ödədiyi məbləğlə məhdudlaşır. Bu məhdudiyyət qanunla istisna edilə bilməyən hallara şamil edilmir.</p>'],
['Şərtlərin dəyişdirilməsi','<p>Şərtləri dəyişsək, yeni mətni bu səhifədə dərc edirik və əhəmiyyətli dəyişikliklər barədə kurslara ən azı 14 gün əvvəl e-poçtla xəbər veririk.</p>'],
['Tətbiq olunan hüquq və mübahisələr','<p>Bu şərtlərə Azərbaycan Respublikasının qanunvericiliyi tətbiq edilir. Mübahisələri əvvəlcə danışıqla həll etməyə çalışırıq. Razılığa gəlinməzsə, mübahisə Bakı şəhərinin müvafiq məhkəməsində baxılır. Türkiyədəki kurslarla müqavilədə başqa qayda nəzərdə tutula bilər.</p>'],
['Əlaqə','<p><a href="mailto:edubbax@gmail.com">edubbax@gmail.com</a> · +994 55 821 75 75</p>']

['Sorumluluğun sınırı','<p>EdubbaX, hizmetin kullanımından doğan dolaylı zararlardan (örneğin gelir kaybı) sorumlu değildir. EdubbaX’in toplam sorumluluğu, kursun son 3 ayda EdubbaX’e ödediği tutarla sınırlıdır. Bu sınır, kanunen hariç tutulamayan durumlara uygulanmaz.</p>'],

S:[
['The service','<p>EdubbaX is a browser-based platform for teachers and tutoring centres: in-lesson quizzes, AI question drafting from material, automatic results, reports, parent report links, a centre panel and payment tracking. The service is provided by the EdubbaX project (founder: Ömər Heydər).</p>'],
['Pilot stage','<p>EdubbaX is currently in its pilot stage. Features may change and new ones may be added. We work to keep the service running without interruption or errors, but during the pilot we cannot fully guarantee this. Planned maintenance is announced in advance.</p>'],
['Accounts','<ul><li>Accounts are opened only by a teacher or an authorised member of a centre’s staff.</li><li>Do not share your sign-in details. You are responsible for actions taken with your account.</li><li>The centre manager adds teachers with an invite code and can remove them.</li></ul>'],
['Centre obligations','<ul><li>add student data to EdubbaX only on a lawful basis and inform parents (see the <a data-l="privacy.html" href="privacy.html">Privacy policy</a>, section 8);</li><li>do not upload material that infringes someone else’s copyright;</li><li>do not misuse the service, probe its security or try to access other users’ data.</li></ul>'],
['Who owns data and material','<p>Student data, results and material entered by a centre belong to the centre. EdubbaX uses them only to provide the service. The centre can export its data at any time.</p><p>The EdubbaX platform, its design, the Illuminated Loop method, the MLI indicator and the software code belong to EdubbaX.</p>'],
['AI-drafted questions','<p>Questions drafted by AI are an aid and can contain mistakes. The teacher must review and approve them before use. Final responsibility for a quiz’s content rests with the teacher.</p>'],
['Prices and payment','<ul><li>Prices are listed under <a data-l="courses.html#pricing" href="courses.html#pricing">Pricing</a>, excluding VAT.</li><li>Payment is by bank transfer against a monthly invoice, within 10 days of the invoice.</li><li>An active student is one who takes part in at least one check in the month; billing uses this count at month end.</li><li>If payment is more than 15 days late, a reminder is sent by email. Seven days after the reminder the account may switch to read-only. No data is deleted.</li><li>Price changes are announced to centres at least 30 days in advance.</li></ul>'],
['Payment tracking section','<p>EdubbaX does not take money from students or parents, does not send payments and is not a bank or payment service. The payments section is only for the centre’s own records, and the centre is responsible for their accuracy.</p>'],

['Limitation of liability','<p>EdubbaX is not liable for indirect losses arising from use of the service (for example, lost revenue). EdubbaX’s total liability is limited to the amount the centre paid EdubbaX in the last 3 months. This limit does not apply where the law does not allow liability to be limited.</p>'],
