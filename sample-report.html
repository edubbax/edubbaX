<link rel="stylesheet" href="assets/site.css">
<style>
.banner{background:rgba(227,164,59,.10);border:1px solid rgba(227,164,59,.4);color:#f1d6a6;border-radius:14px;padding:12px 16px;font-size:14.5px;margin-bottom:26px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 26px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit}
.tabs button[aria-selected=true]{background:var(--gold);color:#1a1400;border-color:var(--gold)}
.panel[hidden]{display:none}
.rhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.rhead h2{margin:0}
.rhead .meta{color:var(--mut);font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi b{display:block;font-family:Georgia,"DejaVu Serif",serif;font-size:30px;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:13.5px}
.kpi em{display:block;font-style:normal;font-size:13px;margin-top:4px;color:var(--ok);font-weight:600}
.kpi em.bad{color:var(--bad)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--dim);stroke-dasharray:4 4;stroke-width:1}
.chart text{fill:var(--dim);font-size:11px;font-family:Inter,system-ui,sans-serif}
.chart .lbl{fill:var(--tx);font-weight:700;font-size:12px}
.topic{display:grid;grid-template-columns:1fr 120px 46px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.topic:first-of-type{border-top:0}
.topic .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.topic .bar i{display:block;height:100%;border-radius:99px}
.topic b{text-align:right;font-variant-numeric:tabular-nums}
.topic small{display:block;color:var(--dim);font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{color:var(--dim);font-weight:600;text-align:left;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);color:var(--tx);font-variant-numeric:tabular-nums}
.tbl td.n,.tbl th.n{text-align:right}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700}
.pill.ok{background:rgba(63,178,127,.14);color:var(--ok)}.pill.bad{background:rgba(224,86,79,.14);color:var(--bad)}.pill.warn{background:rgba(227,164,59,.14);color:var(--warn)}
.quote{border-left:3px solid var(--gold);padding:4px 0 4px 14px;color:var(--tx);font-family:Georgia,"DejaVu Serif",serif;font-size:17px;line-height:1.45;margin:8px 0 0}
.loopfix{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.loopfix .a,.loopfix .b{font-family:Georgia,"DejaVu Serif",serif;font-size:28px;font-weight:700}
.loopfix .a{color:var(--bad)}.loopfix .b{color:var(--ok)}
.loopfix span{color:var(--mut);font-size:14px}
.card h3{font-size:18px;margin-bottom:12px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media(max-width:560px){.topic{grid-template-columns:1fr 70px 40px}.tbl .hs{display:none}}
@media print{.card,.kpi{border-color:#ddd;background:#fff}.kpi b{color:#7a5d00}.banner{color:#6b4a00}.panel[hidden]{display:block!important}.tabs{display:none}}
</style>
</head>

const col=p=>p>=70?css('--ok'):p>=55?css('--warn'):css('--bad');
function lineChart(el,data,s){
 const W=560,H=230,l=34,r=14,t=14,b=28,x=i=>l+i*(W-l-r)/(data.length-1),y=v=>t+(100-v)*(H-t-b)/100;
 let g='';[0,25,50,75,100].forEach(v=>{g+=`<line class="ax" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
 g+=`<line class="tgt" x1="${l}" x2="${W-r}" y1="${y(70)}" y2="${y(70)}"/><text x="${l+6}" y="${y(70)-6}">${s.target}</text>`;
 const pts=data.map((v,i)=>x(i)+','+y(v)).join(' ');
 g+=`<polyline points="${pts}" fill="none" stroke="${css('--gold')}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
 data.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${css('--gold')}"/><text x="${x(i)}" y="${H-8}" text-anchor="middle">${s.wk}${i+1}</text>`});
 const L=data.length-1;g+=`<text class="lbl" x="${x(L)-8}" y="${y(data[L])-10}" text-anchor="end">${data[L]}%</text>`;
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.trend}: ${data.join(', ')}%">${g}</svg>`;
}
function barChart(el,data,s,aria){
 const W=560,H=220,l=34,r=10,t=16,b=28,n=data.length,bw=(W-l-r)/n,y=v=>t+(100-v)*(H-t-b)/100;
 let g='';[0,50,100].forEach(v=>{g+=`<line class="ax" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
 data.forEach((d,i)=>{const X=l+i*bw+bw*.22,w=bw*.56;g+=`<rect x="${X}" y="${y(d[1])}" width="${w}" height="${y(0)-y(d[1])}" rx="5" fill="${col(d[1])}"/><text class="lbl" x="${X+w/2}" y="${y(d[1])-5}" text-anchor="middle">${d[1]}%</text><text x="${X+w/2}" y="${H-8}" text-anchor="middle">${d[0]}</text>`});
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">${g}</svg>`;
}
function pairChart(el,data,s){
 const W=560,H=240,l=34,r=10,t=16,b=44,n=data.length,bw=(W-l-r)/n,y=v=>t+(100-v)*(H-t-b)/100;
 let g='';[0,50,100].forEach(v=>{g+=`<line class="ax" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
 data.forEach((d,i)=>{const X=l+i*bw+bw*.14,w=bw*.34;
  g+=`<rect x="${X}" y="${y(d[1])}" width="${w}" height="${y(0)-y(d[1])}" rx="4" fill="${css('--dim')}"/><rect x="${X+w+3}" y="${y(d[2])}" width="${w}" height="${y(0)-y(d[2])}" rx="4" fill="${css('--gold')}"/><text class="lbl" x="${X+w+3+w/2}" y="${y(d[2])-5}" text-anchor="middle">${d[2]}</text><text x="${X+w+1}" y="${H-26}" text-anchor="middle">${d[0]}</text>`});
 g+=`<rect x="${l}" y="${H-14}" width="10" height="10" rx="2" fill="${css('--dim')}"/><text x="${l+15}" y="${H-5}">${s.g1}</text><rect x="${l+120}" y="${H-14}" width="10" height="10" rx="2" fill="${css('--gold')}"/><text x="${l+135}" y="${H-5}">${s.g2}</text>`;
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.grH}">${g}</svg>`;
}
const pill=(k,s)=>`<span class="pill ${k}">${s[k]}</span>`;
function render(l,s){
 lineChart(document.getElementById('ch-student'),D.trend,s);
 document.getElementById('tp-student').innerHTML=D.topics.map(([k,v,a])=>`<div class="topic"><span>${s[k]}${a?`<small>${s.fixed.replace('{a}',a)}</small>`:''}</span><span class="bar"><i style="width:${v}%;background:${col(v)}"></i></span><b>${v}%</b></div>`).join('');
 document.getElementById('pay-student').innerHTML=D.pay.map(([m,k])=>`<div class="topic" style="grid-template-columns:1fr auto"><span>${s[m]} · 120 AZN</span>${pill(k,s)}</div>`).join('');
 barChart(document.getElementById('ch-q'),D.qs,s,s.qH);
 document.getElementById('risk').innerHTML=D.risk.map(([n,a,t,r])=>`<div class="topic" style="grid-template-columns:1fr auto"><span>${n}<small>${s[r]} · ${t}</small></span><b style="color:${col(a)}">${a}%</b></div>`).join('');
 document.getElementById('tbl-st').innerHTML=`<thead><tr><th>${s.cN}</th><th class="n">${s.cA}</th><th class="n">${s.cC}</th><th class="n hs">${s.cT}</th></tr></thead><tbody>`+D.st.map(([n,a,c,t])=>`<tr><td>${n}</td><td class="n" style="color:${col(a)};font-weight:700">${a}%</td><td class="n ${c>=0?'up':'dn'}">${c>0?'+':''}${c}</td><td class="n hs">${t}</td></tr>`).join('')+'</tbody>';
 pairChart(document.getElementById('ch-groups'),D.groups,s);
 document.getElementById('debt').innerHTML=D.debt.map(([n,g,v])=>`<div class="topic" style="grid-template-columns:1fr auto"><span>${n}<small>${g}</small></span><b>${v} AZN</b></div>`).join('');
 document.getElementById('tbl-te').innerHTML=`<thead><tr><th>${s.tN}</th><th class="hs">${s.tS}</th><th class="n hs">${s.tG}</th><th class="n">${s.tSt}</th><th class="n">${s.tGain}</th><th class="n hs">${s.tAtt}</th></tr></thead><tbody>`+D.te.map(([n,sj,g,st,ga,at])=>`<tr><td>${n}</td><td class="hs">${s[sj]}</td><td class="n hs">${g}</td><td class="n">${st}</td><td class="n up">+${ga} ${s.pp}</td><td class="n hs">${at}%</td></tr>`).join('')+'</tbody>';
}
edxI18n(T,render);
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(b=>{const on=b.getAttribute('aria-controls')===id;b.setAttribute('aria-selected',on);document.getElementById(b.getAttribute('aria-controls')).hidden=!on});try{history.replaceState(null,'',location.pathname+location.search+'#'+id)}catch(e){}}
tabs.forEach(b=>b.addEventListener('click',()=>show(b.getAttribute('aria-controls'))));
const h=location.hash.slice(1);if(['parent','teacher','center'].includes(h))show(h);
</script>
</body>
</html>
