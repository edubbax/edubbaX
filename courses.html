let L;
function calc(){
 const s=T[L.lang],n=+document.getElementById('n').value,v=Math.max(150,n*4),p=(v/n).toFixed(2).replace(/\.00$/,'');

 document.getElementById('out').innerHTML=s.cOut.replace('{v}',v.toLocaleString('en-US'))+'<small>'+s.cPer.replace('{p}',p)+'</small>';
}
L=edxI18n(T,()=>{if(L)calc()});
document.getElementById('n').addEventListener('input',calc);calc();
