<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EdubbaX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="EdubbaX — online lessons, personal-ID joining and in-lesson quizzes with real-time understanding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: ink-black classroom with a single mustard-gold signal; a chalkboard stage in the live room; serif voice for headings, clean grotesk for work. */
:root {
  --bg: #0D0C0A;
  --bg-2: #12110E;
  --surface: #181713;
  --surface-2: #201E19;
  --line: #2C2A23;
  --line-2: #3A372E;
  --fg: #F3EFE4;
  --fg-2: #C9C3B3;
  --muted: #8E8878;
  --gold: #D9A92B;
  --gold-2: #F0C24B;
  --gold-ink: #1A1404;
  --gold-soft: rgba(217, 169, 43, .14);
  --good: #3FB27F;
  --good-soft: rgba(63, 178, 127, .14);
  --warn: #E39A3B;
  --warn-soft: rgba(227, 154, 59, .15);
  --bad: #E0564F;
  --bad-soft: rgba(224, 86, 79, .14);
  --info: #6EA4E6;
  --info-soft: rgba(110, 164, 230, .14);
  --chalkboard: #1B2420;
  --chalk: #F3EFE4;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.7);
  --f-display: "Cormorant Garamond", "Noto Serif", Georgia, "Songti SC", "SimSun", serif;
  --f-body: "Onest", "IBM Plex Sans Arabic", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  --r-s: 9px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F5F1; --bg-2: #EEECE5; --surface: #FFFFFF; --surface-2: #F7F5EF; --line: #E3DFD3; --line-2: #D3CEBF;
    --fg: #17150F; --fg-2: #3E3A30; --muted: #716B5B; --gold: #A97C08; --gold-2: #C8960F; --gold-ink: #FFFDF6; --gold-soft: rgba(169, 124, 8, .11);
    --good: #1E8A5A; --good-soft: rgba(30, 138, 90, .11); --warn: #B86A0E; --warn-soft: rgba(184, 106, 14, .12); --bad: #C23B34; --bad-soft: rgba(194, 59, 52, .1);
    --info: #2F6DB5; --info-soft: rgba(47, 109, 181, .1); --chalkboard: #23302A; --chalk: #F3EFE4;
    --shadow: 0 1px 2px rgba(23,21,15,.05), 0 12px 32px -20px rgba(23,21,15,.25);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F6F5F1; --bg-2: #EEECE5; --surface: #FFFFFF; --surface-2: #F7F5EF; --line: #E3DFD3; --line-2: #D3CEBF;
  --fg: #17150F; --fg-2: #3E3A30; --muted: #716B5B; --gold: #A97C08; --gold-2: #C8960F; --gold-ink: #FFFDF6; --gold-soft: rgba(169, 124, 8, .11);
  --good: #1E8A5A; --good-soft: rgba(30, 138, 90, .11); --warn: #B86A0E; --warn-soft: rgba(184, 106, 14, .12); --bad: #C23B34; --bad-soft: rgba(194, 59, 52, .1);
  --info: #2F6DB5; --info-soft: rgba(47, 109, 181, .1); --chalkboard: #23302A; --chalk: #F3EFE4;
  --shadow: 0 1px 2px rgba(23,21,15,.05), 0 12px 32px -20px rgba(23,21,15,.25);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
:lang(ar) { --f-display: "IBM Plex Sans Arabic", var(--f-body); }
:lang(zh) { --f-display: "Songti SC", "Noto Serif SC", "SimSun", serif; }
:lang(ar) body, :lang(ar) { letter-spacing: 0 !important; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--f-display); font-weight: 600; letter-spacing: -.01em; line-height: 1.08; }
h3 { font-size: 1.02rem; font-weight: 600; }
h4 { font-size: .92rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--gold); color: var(--gold-ink); }
.ic { width: 18px; height: 18px; flex: none; }
.ic.big { width: 40px; height: 40px; stroke-width: 1.4; }
.ic.tiny { width: 13px; height: 13px; vertical-align: -2px; }
[dir="rtl"] .ic.flip { transform: scaleX(-1); }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.tiny-t { font-size: .72rem; }
.mono { font-family: var(--f-mono); font-size: .92em; letter-spacing: .02em; }
.center { text-align: center; }
.sel { user-select: all; }
.ok-t { color: var(--good); }
.bad-t { color: var(--bad); }
.grow { flex: 1; }
.row { display: flex; align-items: center; }
.gap-s { gap: 8px; }
.between { justify-content: space-between; }
.end { justify-content: flex-end; }
.wrap-row { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.narrow { max-width: 760px; }
.sec { padding-block: 56px; }
.pad-xl { padding-block: 120px; }

/* ---------- wordmark ---------- */
.wm { display: inline-flex; align-items: baseline; gap: 1px; line-height: 1; white-space: nowrap; direction: ltr; }
.wm-e { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 1.62rem; color: var(--gold); letter-spacing: -.01em; }
.wm-x { position: relative; font-family: "Onest", system-ui, sans-serif; font-weight: 800; font-size: 1.42rem; color: var(--fg); margin-inline-start: 1px; }
.wm-s { position: absolute; width: 10px; height: 10px; top: -9px; left: 50%; transform: translateX(-50%); color: var(--muted); }
.wm.sm .wm-e { font-size: 1.35rem; } .wm.sm .wm-x { font-size: 1.18rem; }
.wm.md .wm-e { font-size: 2.1rem; } .wm.md .wm-x { font-size: 1.85rem; } .wm.md .wm-s { width: 13px; height: 13px; top: -12px; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 20px; height: 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { text-decoration: none; padding-top: 8px; }
.nav { display: flex; gap: 4px; margin-inline-start: 12px; }
.nav-a { text-decoration: none; color: var(--fg-2); padding: 8px 12px; border-radius: 999px; font-weight: 500; font-size: .93rem; }
.nav-a:hover { color: var(--fg); background: var(--surface); }
.nav-a.on { color: var(--fg); background: var(--surface-2); }
.tools { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }
.lang { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 0 4px 0 10px; height: 36px; color: var(--fg-2); background: var(--surface); }
.lang select { appearance: none; background: transparent; border: 0; padding: 0 8px 0 0; height: 34px; color: var(--fg); font-size: .88rem; cursor: pointer; }
.lang select option { background: var(--surface); color: var(--fg); }
.lang.block { display: flex; width: 100%; }
.lang.block select { flex: 1; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); cursor: pointer; flex: none; text-decoration: none; }
.icon-btn:hover { color: var(--fg); border-color: var(--line-2); }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.only-sm { display: none; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; font-size: .93rem; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .12s ease, background .15s ease, border-color .15s ease; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.lg { min-height: 50px; padding: 0 22px; font-size: 1rem; }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: .85rem; gap: 6px; }
.btn.sm .ic { width: 15px; height: 15px; }
.btn.block { display: flex; width: 100%; }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.gold:hover { background: var(--gold-2); }
.btn.outline { border-color: var(--line-2); background: transparent; color: var(--fg); }
.btn.outline:hover { border-color: var(--gold); }
.btn.ghost { background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); color: #fff; }
.btn.warn-solid { background: var(--warn); color: #1a1004; }
.btn.is-busy { opacity: .7; pointer-events: none; }
.link-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 0; color: var(--fg-2); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-2); font-weight: 500; }
.link-btn:hover { color: var(--gold); }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--bad); flex-wrap: wrap; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- pills, chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .74rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
:lang(ar) .pill, :lang(zh) .pill { text-transform: none; letter-spacing: 0; }
.pill.live { background: var(--bad-soft); color: var(--bad); }
.pill.live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); animation: pulse 1.6s ease-in-out infinite; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.muted { background: var(--surface-2); color: var(--muted); }
.pill.diff-easy { background: var(--good-soft); color: var(--good); }
.pill.diff-medium { background: var(--gold-soft); color: var(--gold); }
.pill.diff-hard { background: var(--bad-soft); color: var(--bad); }
@keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.code-chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: .86rem; letter-spacing: .04em; padding: 4px 10px; border-radius: 8px; background: var(--gold-soft); color: var(--gold); border: 1px dashed color-mix(in srgb, var(--gold) 45%, transparent); cursor: pointer; direction: ltr; white-space: nowrap; }
.code-chip .ic { width: 14px; height: 14px; opacity: .7; }
.code-chip:hover { border-style: solid; }
.code-chip.big { font-size: 1.25rem; padding: 10px 16px; }
.code-chip.big .ic { width: 18px; height: 18px; }
.mode-chip { display: inline-block; font-size: .74rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); }
.mode-chip.cloud { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.score { display: inline-block; font-weight: 700; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 6px; font-size: .9rem; }
.score.sm { font-size: .78rem; padding: 1px 6px; }
.score.good { color: var(--good); background: var(--good-soft); }
.score.warn { color: var(--warn); background: var(--warn-soft); }
.score.bad { color: var(--bad); background: var(--bad-soft); }
.score.muted { color: var(--muted); background: var(--surface-2); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); color: var(--fg-2); font-size: .72rem; font-weight: 700; flex: none; border: 1px solid var(--line); letter-spacing: .02em; }
.av.gold { background: var(--gold-soft); color: var(--gold); border-color: color-mix(in srgb, var(--gold) 35%, transparent); }
.av.lg { width: 48px; height: 48px; font-size: .95rem; }
.av.xl { width: 68px; height: 68px; font-size: 1.3rem; font-family: var(--f-display); }

/* ---------- landing ---------- */
.hero { border-bottom: 1px solid var(--line); background: radial-gradient(900px 420px at 85% 10%, var(--gold-soft), transparent 70%), var(--bg); }
.hero-in { display: grid; grid-template-columns: 1.15fr .85fr; gap: 56px; align-items: center; padding-block: 72px 80px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 600; margin-bottom: 18px; }
:lang(ar) .eyebrow, :lang(zh) .eyebrow { text-transform: none; letter-spacing: .02em; }
.eb-s { width: 12px; height: 12px; }
.hero h1 { font-size: clamp(2.4rem, 5.2vw, 4.3rem); max-width: 14ch; }
:lang(ru) .hero h1, :lang(tr) .hero h1, :lang(az) .hero h1 { max-width: 16ch; }
.lead { font-size: 1.12rem; color: var(--fg-2); margin-top: 20px; max-width: 54ch; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.hero .link-btn { margin-top: 18px; }
.demo-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; transform: rotate(-1.2deg); }
[dir="rtl"] .demo-card { transform: rotate(1.2deg); }
.demo-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.demo-q { font-family: var(--f-mono); font-size: 1.15rem; padding: 16px; border-radius: 12px; background: var(--chalkboard); color: var(--chalk); direction: ltr; text-align: center; }
.demo-row { display: grid; grid-template-columns: 7.5em 1fr; gap: 12px; align-items: center; font-size: .86rem; color: var(--fg-2); }
.demo-alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--bad-soft); color: var(--fg); }
.demo-alert .ic { color: var(--bad); margin-top: 2px; }
.demo-alert div { display: flex; flex-direction: column; font-size: .86rem; } .demo-alert span { color: var(--fg-2); }
.demo-foot { display: flex; align-items: center; gap: 8px; color: var(--good); font-weight: 600; font-size: .9rem; }
.band { background: var(--bg-2); border-bottom: 1px solid var(--line); padding-block: 64px; }
.band.alt { background: var(--bg); }
.sec-head { max-width: 680px; margin-bottom: 36px; }
.sec-head h2 { font-size: clamp(1.9rem, 3.4vw, 2.7rem); }
.sec-head p.muted { margin-top: 12px; font-size: 1.04rem; }
.loop { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.loop li { padding: 22px 20px 24px; border-inline-end: 1px solid var(--line); position: relative; min-width: 0; }
.loop li:last-child { border-inline-end: 0; }
.loop-n { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; color: var(--gold); display: block; margin-bottom: 14px; font-weight: 600; }
.loop h3 { font-size: 1.05rem; margin-bottom: 6px; }
.loop p { color: var(--fg-2); font-size: .9rem; }
.roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.role { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.role-ic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--gold-soft); color: var(--gold); }
.role h3 { font-family: var(--f-display); font-size: 1.5rem; font-weight: 600; }
.role ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.role li { display: flex; gap: 10px; color: var(--fg-2); font-size: .93rem; }
.role li .ic { color: var(--gold); width: 16px; height: 16px; margin-top: 3px; }
.role .btn { align-self: flex-start; }
.feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.feat { background: var(--surface); padding: 26px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.feat > .ic { color: var(--gold); width: 22px; height: 22px; }
.feat p { color: var(--fg-2); font-size: .92rem; }
.cta-band { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; padding: 40px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); background-image: radial-gradient(600px 200px at 0% 0%, var(--gold-soft), transparent 70%); }
.cta-band h2 { font-size: clamp(1.7rem, 3vw, 2.3rem); }
.cta-band p { color: var(--fg-2); margin-top: 8px; max-width: 52ch; }
.cta-band .cta-row { margin-top: 0; }

/* ---------- footer ---------- */
.footer { border-top: 1px solid var(--line); padding-block: 44px 24px; background: var(--bg-2); }
.footer-in { display: flex; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
.foot-brand p { color: var(--muted); margin-top: 12px; max-width: 34ch; font-size: .9rem; }
.foot-cols { display: flex; gap: 56px; flex-wrap: wrap; }
.foot-cols div { display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
.foot-cols h4 { color: var(--muted); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 4px; }
.foot-cols a { color: var(--fg-2); text-decoration: none; } .foot-cols a:hover { color: var(--gold); }
.foot-base { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem; }

/* ---------- about ---------- */
.page-h { font-size: clamp(2.1rem, 4.2vw, 3.2rem); margin-bottom: 8px; }
.sub-h { font-size: 1.9rem; margin: 48px 0 18px; }
.ceo { display: grid; grid-template-columns: 300px 1fr; gap: 44px; align-items: start; margin-top: 36px; padding: 36px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.ceo-portrait { aspect-ratio: 4 / 5; max-width: 100%; border-radius: 18px; background: radial-gradient(120% 90% at 30% 20%, #2a2516, #0f0e0b 70%); display: grid; place-items: center; position: relative; overflow: hidden; border: 1px solid var(--line); }
.ceo-portrait span { font-family: "Cormorant Garamond", Georgia, serif; font-size: 6.5rem; color: #D9A92B; font-weight: 600; letter-spacing: -.02em; }
.ceo-s { position: absolute; width: 26px; height: 26px; top: 22%; right: 22%; color: #F3EFE4; opacity: .85; }
.ceo-role { color: var(--gold); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; font-weight: 600; }
:lang(ar) .ceo-role, :lang(zh) .ceo-role { text-transform: none; letter-spacing: 0; }
.ceo-body h2 { font-size: clamp(2.2rem, 4vw, 3rem); margin: 6px 0 18px; }
.ceo-body blockquote { margin: 0 0 20px; padding-inline-start: 18px; border-inline-start: 3px solid var(--gold); font-family: var(--f-display); font-size: 1.45rem; line-height: 1.3; color: var(--fg); }
.ceo-body p { color: var(--fg-2); margin-bottom: 12px; max-width: 64ch; }
.ceo-contact { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.about-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
.about-grid .panel p { color: var(--fg-2); margin-top: 8px; font-size: .93rem; }
.team { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.member { display: flex; align-items: center; gap: 14px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.member div { display: flex; flex-direction: column; min-width: 0; } .member span { color: var(--muted); font-size: .85rem; }
.member.lead { border-color: color-mix(in srgb, var(--gold) 40%, var(--line)); }

/* ---------- auth / join ---------- */
.auth { display: grid; place-items: center; padding-block: 56px 80px; }
.auth-card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 34px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.auth-card h1 { font-size: 2.1rem; margin-top: 6px; }
.auth-alt { color: var(--muted); font-size: .9rem; text-align: center; }
.auth-alt a { color: var(--gold); }
.auth-demo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--gold-soft); font-size: .86rem; flex-wrap: wrap; }
.auth-switch { display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--fg-2); font-size: .88rem; text-decoration: none; padding-top: 10px; border-top: 1px solid var(--line); }
.auth-switch:hover { color: var(--gold); }
.join-ic { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); }
.join-ic .ic { width: 28px; height: 28px; }
.code-input { font-family: var(--f-mono) !important; font-size: 1.5rem !important; letter-spacing: .12em; text-align: center; height: 62px !important; direction: ltr; text-transform: uppercase; }
.join-steps { margin: 4px 0 0; padding-inline-start: 20px; color: var(--fg-2); font-size: .88rem; display: flex; flex-direction: column; gap: 6px; }

/* ---------- forms ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.fld > span, .fld > legend { font-size: .82rem; font-weight: 600; color: var(--fg-2); padding: 0; }
.fld small { color: var(--muted); font-size: .8rem; }
input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea {
  width: 100%; min-height: 44px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--fg); outline: none; transition: border-color .15s;
}
textarea { resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
input:disabled { opacity: .6; }
.form-err { color: var(--bad); font-size: .86rem; min-height: 0; display: none; }
.form-err.show { display: block; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row-3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px; }
.inline-form { display: flex; gap: 8px; align-items: center; }
.inline-form input { min-height: 36px !important; padding: 6px 12px !important; width: 180px !important; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; cursor: pointer; background: var(--bg-2); }
.check:has(input:checked) { border-color: var(--gold); background: var(--gold-soft); }
.check input { margin-top: 4px; accent-color: var(--gold); }
.check span { display: flex; flex-direction: column; min-width: 0; } .check small { color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: .9rem; color: var(--fg-2); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); transition: inset-inline-start .15s; }
.switch input:checked + .sw { background: var(--gold); }
.switch input:checked + .sw::after { inset-inline-start: 19px; background: var(--gold-ink); }
.switch input:focus-visible + .sw { outline: 2px solid var(--gold); outline-offset: 2px; }
.file-btn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 10px; cursor: pointer; color: var(--fg-2); font-size: .88rem; }
.file-btn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.file-btn:hover { border-color: var(--gold); color: var(--fg); }

/* ---------- teacher workspace ---------- */
/* paper answer sheets */
.sheet { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin: 0 auto 18px; max-width: 780px; font-family: var(--f-body); }
.sheet-cut { border-bottom: 1px dashed #999; padding-bottom: 8px; margin-bottom: 12px; font-size: 13px; color: #333; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.sheet-brand { font-weight: 800; font-size: 18px; letter-spacing: .02em; }
.sheet-id { text-align: center; }
.sheet-id .qr svg { width: 92px; height: 92px; display: block; margin: 0 auto 4px; }
.sheet-code { font-family: var(--f-mono); font-size: 22px; font-weight: 700; letter-spacing: .08em; border: 2px solid #111; border-radius: 6px; padding: 4px 10px; }
.sheet-q { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 9px; }
.sheet-q li { break-inside: avoid; border-top: 1px solid #e3e3e3; padding-top: 7px; font-size: 13.5px; }
.sheet-q .qn { font-weight: 700; margin-inline-end: 6px; }
.sheet-box { border: 1.5px solid #111; border-radius: 6px; min-height: 92px; margin-top: 6px; padding: 4px 8px; font-size: 11px; color: #777; background: repeating-linear-gradient(#fff, #fff 22px, #ddd 23px); }
.bubbles { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 5px; }
.bub { display: inline-flex; align-items: center; gap: 6px; }
.bub i { width: 20px; height: 20px; border: 1.8px solid #111; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; }
.paper-card { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: start; }
.paper-card img { width: 120px; border-radius: 8px; border: 1px solid var(--line); }
.paper-ans { display: flex; flex-wrap: wrap; gap: 6px; }
.paper-ans label { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; }
.paper-ans select { padding: 4px 6px; min-width: 54px; }
.paper-ans .unsure select { border-color: var(--warn); background: var(--warn-soft); }
@media print {
  @page { size: A4; margin: 12mm; }
  body * { visibility: hidden; }
  #paper-print, #paper-print * { visibility: visible; }
  #paper-print { position: absolute; inset: 0 auto auto 0; width: 100%; }
  .sheet { border: 0; border-radius: 0; margin: 0; max-width: none; padding: 0; page-break-after: always; break-after: page; }
  .no-print { display: none !important; }
}
.ws { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100vh - 64px); }
.side { border-inline-end: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 16px; background: var(--bg-2); position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); height: calc(100vh - 64px); overflow-y: auto; }
.side-me { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; border-bottom: 1px solid var(--line); }
.side-me div { display: flex; flex-direction: column; min-width: 0; } .side-me b { font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .side-me span { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--fg-2); font-weight: 500; font-size: .93rem; white-space: nowrap; }
.side-nav a:hover { background: var(--surface); color: var(--fg); }
.side-nav a.on { background: var(--surface-2); color: var(--fg); box-shadow: inset 3px 0 0 var(--gold); }
[dir="rtl"] .side-nav a.on { box-shadow: inset -3px 0 0 var(--gold); }
.side-nav a.on .ic { color: var(--gold); }
.side-live { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--line)); background: var(--bad-soft); text-decoration: none; font-size: .88rem; }
.side-live span:last-child { color: var(--fg-2); font-size: .8rem; }
.side-out { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 10px; font-size: .9rem; }
.side-out:hover { color: var(--fg); background: var(--surface); }
.ws-main { padding: 32px 36px 64px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ph h1 { font-size: clamp(1.9rem, 3vw, 2.5rem); }
.ph p { margin-top: 6px; max-width: 70ch; }
.ph-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: .88rem; align-self: flex-start; }
.back:hover { color: var(--gold); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.panel > h3, .panel-h h3 { display: flex; align-items: center; gap: 8px; }
.panel > h3 { margin-bottom: 12px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-h h3 .ic, .panel > h3 .ic { color: var(--gold); }
.panel.notice { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.panel.notice > div { flex: 1; min-width: 200px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpis:has(> :nth-child(3):last-child) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .82rem; font-weight: 500; }
.kpi-top .ic { width: 16px; height: 16px; color: var(--gold); }
.kpi-v { font-family: var(--f-display); font-size: 2.3rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
:lang(ar) .kpi-v, :lang(zh) .kpi-v { font-family: var(--f-body); font-weight: 700; font-size: 2rem; }
.kpi-s { color: var(--muted); font-size: .8rem; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-side { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.grid-side.wide { grid-template-columns: minmax(0, 1fr) 320px; }
.live-banner { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); background: var(--bad-soft); text-decoration: none; flex-wrap: wrap; }
.live-banner div { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
.live-banner div span { color: var(--fg-2); font-size: .88rem; }
.list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.li-main { display: flex; flex-direction: column; min-width: 0; text-decoration: none; }
.li-main b { overflow: hidden; text-overflow: ellipsis; }
.li-side { display: flex; align-items: center; gap: 6px; flex: none; }
.checklist { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checklist li { display: flex; align-items: center; gap: 12px; }
.checklist a { color: var(--fg); text-decoration: none; } .checklist a:hover { color: var(--gold); }
.checklist li.ok a { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.ck { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; }
.checklist li.ok .ck { background: var(--good); border-color: var(--good); color: #fff; }
.ck .ic { width: 13px; height: 13px; stroke-width: 3; }
.next { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding-bottom: 18px; }
.quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
.q-a { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); text-decoration: none; font-size: .88rem; color: var(--fg-2); }
.q-a .ic { color: var(--gold); }
.q-a:hover { border-color: var(--gold); color: var(--fg); }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 40px 16px; color: var(--muted); }
.empty .ic { color: var(--line-2); margin-bottom: 4px; }
.empty h3 { color: var(--fg); font-size: 1.1rem; }
.empty p { max-width: 46ch; font-size: .92rem; }
.empty .btn { margin-top: 8px; }

/* tabs */
.tabs-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--fg-2); }
.tab.on { border-color: var(--gold); color: var(--fg); background: var(--gold-soft); }
.tab-n { font-size: .74rem; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

/* tables */
.tbl-wrap { overflow-x: auto; margin-inline: -4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: start; font-weight: 600; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
:lang(ar) .tbl th, :lang(zh) .tbl th { text-transform: none; letter-spacing: 0; }
.tbl td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: end; font-variant-numeric: tabular-nums; }
.tbl .act { text-align: end; width: 1%; white-space: nowrap; }
.tbl tr.fresh td { background: var(--gold-soft); }
.tbl .ic.ok { color: var(--good); } .tbl .ic.muted { color: var(--muted); }
.who { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.who:hover b { color: var(--gold); }
.add-panel { display: flex; flex-direction: column; gap: 12px; }
.new-ids { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; background: var(--gold-soft); }
.new-ids h4 { display: flex; align-items: center; gap: 8px; color: var(--gold); }
.id-card { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .88rem; }
.id-card span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.howto { padding: 14px; border-radius: 12px; border: 1px dashed var(--line-2); margin-top: 8px; }
.howto h4 { margin-bottom: 4px; }
.howto p { color: var(--fg-2); }
.id-panel { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

/* quiz bank & editor */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card:hover { border-color: var(--line-2); }
.qcard h3 { font-family: var(--f-display); font-size: 1.35rem; font-weight: 600; }
.qcard-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qcard-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.qedit { position: relative; display: flex; flex-direction: column; gap: 12px; }
.qedit legend { display: flex; align-items: center; gap: 10px; font-weight: 600; padding: 0 6px; margin-inline-start: -6px; }
.qdel { position: absolute; top: 14px; inset-inline-end: 14px; }
.qnum { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 8px; background: var(--gold-soft); color: var(--gold); font-weight: 700; font-size: .82rem; padding: 0 6px; flex: none; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt-edit { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg-2); min-width: 0; }
[dir="rtl"] .opt-edit { padding: 4px 10px 4px 4px; }
.opt-edit.is-correct { border-color: var(--good); background: var(--good-soft); }
.opt-edit input[type=radio] { accent-color: var(--good); width: 18px; height: 18px; flex: none; cursor: pointer; }
.opt-edit input:not([type=radio]) { border: 0 !important; background: transparent !important; box-shadow: none !important; min-height: 38px !important; padding: 6px !important; }
.opt-l { font-family: var(--f-mono); font-size: .8rem; font-weight: 700; color: var(--muted); flex: none; }
.ai-panel { border-color: color-mix(in srgb, var(--gold) 35%, var(--line)); background-image: radial-gradient(400px 160px at 100% 0%, var(--gold-soft), transparent 70%); }
.ai-panel .form { margin-top: 12px; }
.ai-s { width: 15px; height: 15px; color: var(--gold); }
.btn.gold .ai-s { color: var(--gold-ink); }
.tips { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--fg-2); font-size: .88rem; }

/* lessons list */
.lesson-form { border-color: color-mix(in srgb, var(--gold) 35%, var(--line)); }
.lesson-list { display: flex; flex-direction: column; gap: 10px; }
.lesson { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); flex-wrap: wrap; }
.lesson.live { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.lesson-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 320px; }
.lesson-main h3 { font-size: 1.12rem; }
.lesson-act { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.progress-mini { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }

/* meters & charts */
.meter { display: flex; align-items: center; gap: 12px; }
.meter-track { position: relative; flex: 1; height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.meter-fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 999px; background: var(--muted); transition: width .5s ease; }
.meter.good .meter-fill { background: var(--good); } .meter.warn .meter-fill { background: var(--warn); } .meter.bad .meter-fill { background: var(--bad); }
.meter-line { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--fg); opacity: .55; border-radius: 2px; }
.meter b { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: end; }
.chart { overflow-x: auto; margin: 4px 0 12px; }
.chart svg { width: 100%; min-width: 360px; height: auto; display: block; direction: ltr; }
.g-grid { stroke: var(--line); stroke-width: 1; }
.g-lbl { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.g-lbl.th { fill: var(--fg-2); }
.g-th { stroke: var(--fg-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
.g-bar { fill: var(--muted); } .g-bar.good { fill: var(--good); } .g-bar.warn { fill: var(--warn); } .g-bar.bad { fill: var(--bad); }
.qstats { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.qstat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--bg-2); font-size: .88rem; }
.qtext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.run { display: flex; flex-direction: column; gap: 10px; }
.run .panel-h { margin-bottom: 4px; }

/* ---------- live room ---------- */
.main.bare { min-height: 100vh; }
.room { display: flex; flex-direction: column; min-height: 100vh; }
.room-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; gap: 16px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.room-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 240px; }
.room-title h1 { font-size: 1.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.room-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); flex: 1; align-items: start; max-width: 1500px; width: 100%; margin: 0 auto; }
.stage-col, .side-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.side-col { position: static; }
[data-elapsed].over { color: var(--warn); }
.stage { display: flex; flex-direction: column; gap: 14px; }
.board-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); cursor: pointer; padding: 0; }

/* ---- data.js ---- */
/* =========================================================================
   EdubbaX — data layer
   One API, two backends:
     • LocalBackend    — demo mode. Data lives in this browser (localStorage)
                         and syncs live between open tabs (BroadcastChannel).
     • SupabaseBackend — production mode. Teachers sign in with Supabase Auth,
                         students reach their data only through RPC functions
                         keyed by their personal ID. Works across devices.
   ========================================================================= */

const CODE_ALPHABET = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"; // no 0/O, 1/I/L
const THRESHOLD = 65; // understanding line (%) — below it a gap is detected

function rnd(n, alphabet = CODE_ALPHABET) {
  const out = [];
  const buf = new Uint32Array(n);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  for (let i = 0; i < n; i++) out.push(alphabet[buf[i] % alphabet.length]);
  return out.join("");
}
function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + rnd(10, "abcdefghijkmnpqrstuvwxyz23456789");
}
function newStudentCode() { const b = rnd(7); return "EX-" + b.slice(0, 3) + "-" + b.slice(3); }
function newLessonCode() { return rnd(6); }
function newToken() { return rnd(18, "abcdefghijkmnpqrstuvwxyz23456789"); }

/** Accepts "ex 4k7-p2qm", "EX4K7P2QM", "4K7P2QM" … → "EX-4K7-P2QM" (or null). */
function normalizeCode(raw) {
  let s = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (s.length === 9 && s.startsWith("EX")) s = s.slice(2);
  if (s.length !== 7) return null;
  for (const ch of s) if (!CODE_ALPHABET.includes(ch)) return null;
  return "EX-" + s.slice(0, 3) + "-" + s.slice(3);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/** For every question, a display order of the original option indices. */
function makePerm(quiz) { return quiz.questions.map(q => shuffle(q.options.map((_, i) => i))); }

function scoreAnswers(quiz, answers, grades) {
  let correct = 0, pending = 0;
  quiz.questions.forEach((q, i) => {
    if (isOpenQ(q)) { const g = grades && typeof grades[i] === "number" ? Math.min(1, Math.max(0, grades[i])) : null; if (g == null) pending++; else correct += g; }
    else if (answers[i] === q.correct) correct++;
  });
  const total = quiz.questions.length;
  return { correctCount: Math.floor(correct), total, score: total ? Math.round((correct / total) * 100) : 0, pending };
}

/** Questions as a student may see them while answering: no correct index. */
function publicQuestions(quiz, perm, reveal) {
  return quiz.questions.map((q, i) => ({
    id: q.id, text: q.text, type: q.type || "mcq", points: q.points || 1,
    options: (perm && perm[i] && perm[i].length ? perm[i] : q.options.map((_, k) => k)).map(k => ({ i: k, text: q.options[k] })),
    correct: reveal ? q.correct : undefined, model: reveal ? q.model : undefined,
  }));
}

function understandingOf(attempts) {
  if (!attempts.length) return null;
  return Math.round(attempts.reduce((s, a) => s + a.score, 0) / attempts.length);
}

/** Per-question correct rate for a set of attempts on one quiz. */
function questionStats(quiz, attempts) {
  return quiz.questions.map((q, i) => {
    if (isOpenQ(q)) { const gs = attempts.map(a => a.grades && a.grades[i]).filter(g => typeof g === "number"); return { q, index: i, answered: gs.length, rate: gs.length ? Math.round(100 * gs.reduce((x, y) => x + y, 0) / gs.length) : null }; }
    const answered = attempts.filter(a => a.answers[i] !== undefined && a.answers[i] !== null);
    const right = answered.filter(a => a.answers[i] === q.correct).length;
    return { q, index: i, answered: answered.length, rate: answered.length ? Math.round((right / answered.length) * 100) : null };
  });
}

async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

class AppError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }

/*  Local backend (demo mode)                                          */
/* ------------------------------------------------------------------ */
const LS_KEY = "edubbax.db.v1";
const LS_VER = "edubbax.db.ver";
const LS_SESSION = "edubbax.session";

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function emptyDB() {
  return { v: 0, teachers: [], groups: [], students: [], quizzes: [], lessons: [], exams: [], attempts: [], messages: [], presence: {}, materials: [], payments: [], centers: [], centerMembers: [], centerPlans: [] };
}

class LocalBackend {
  constructor() {
    this.mode = "local";
    this.listeners = new Set();
    this.memory = null; // fallback when storage is blocked
    this.lastVer = lsGet(LS_VER);
    try {
      this.bc = new BroadcastChannel("edubbax-sync");
      this.bc.onmessage = () => this._emit();
    } catch (e) { this.bc = null; }
    window.addEventListener("storage", (e) => { if (e.key === LS_VER) this._emit(); });
    // safety net for browsers without BroadcastChannel / storage events in frames
    setInterval(() => {
      const v = lsGet(LS_VER);
      if (v !== this.lastVer) { this.lastVer = v; this._emit(); }
    }, 1500);
  }
  _read() {
    const raw = lsGet(LS_KEY);
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    return this.memory || emptyDB();
  }
  _write(db) {
    db.v = (db.v || 0) + 1;
    const ok = lsSet(LS_KEY, JSON.stringify(db));
    if (!ok) this.memory = db;

  async simulateRun(lessonId, runId, pCorrect) {
    const me = this._requireMe();
    this._mut(db => {
      const l = db.lessons.find(x => x.id === lessonId && x.teacherId === me.id);
      if (!l || !l.active || l.active.runId !== runId) return;
      const quiz = db.quizzes.find(q => q.id === l.active.quizId);
      const done = new Set(db.attempts.filter(a => a.runId === runId).map(a => a.studentId));
      const roster = db.students.filter(s => s.groupId === l.groupId);
      const pres = db.presence[lessonId] || {};
      for (const s of roster) {
        if (done.has(s.id)) continue;
        if (pres[s.id] && Date.now() - pres[s.id].at < 12000) continue; // real, connected students answer themselves
        const answers = quiz.questions.map(q => Math.random() < pCorrect ? q.correct : pickWrong(q));
        db.attempts.push({ id: uid(), teacherId: me.id, studentId: s.id, kind: "lesson", lessonId, runId, quizId: quiz.id, answers, ...scoreAnswers(quiz, answers), sim: true, at: Date.now() });
      }
    });
  }

  async studentPortal(code) {
    const db = this._read();

    const teacher = db.teachers.find(t => t.id === s.teacherId);

    const live = db.lessons.filter(l => l.groupId === s.groupId && l.status === "live").sort((a, b) => b.startedAt - a.startedAt)[0];
    const myAttempts = db.attempts.filter(a => a.studentId === s.id);
    const exams = db.exams.filter(e => e.groupId === s.groupId && e.status === "open").map(e => {
      const q = db.quizzes.find(x => x.id === e.quizId);
      return { id: e.id, title: e.title, count: q ? q.questions.length : 0, timeLimitMin: e.timeLimitMin, done: myAttempts.some(a => a.examId === e.id) };
    });
    const history = myAttempts.map(a => historyRow(db, a)).sort((a, b) => b.at - a.at);
    return {
      student: { id: s.id, name: s.name, code: s.code, reportToken: s.reportToken },
      group: group ? { id: group.id, name: group.name } : null,
      teacher: teacher ? { name: teacher.name, subject: teacher.subject } : null,

  async studentLesson(code, lessonId) {

      this._mut(d => {
        d.presence[lessonId] = d.presence[lessonId] || {};
        const p = d.presence[lessonId][s.id] || { joinedAt: Date.now(), hand: false };
        p.at = Date.now(); p.name = s.name;
        d.presence[lessonId][s.id] = p;
      });
    }
    return studentLessonView(this._read(), l.id, s);

  async studentSubmit(code, { kind, lessonId, runId, examId, answers }) {
    let result;
    this._mut(db => {
      const s = this._student(db, code);
      if (!s) throw new AppError("bad_code");
      let quiz, rec;
      if (kind === "lesson") {
        const l = db.lessons.find(x => x.id === lessonId && x.groupId === s.groupId);
        if (!l || !l.active || l.active.runId !== runId || l.active.status !== "open") throw new AppError("closed");
        if (db.attempts.some(a => a.runId === runId && a.studentId === s.id)) throw new AppError("already");
        quiz = db.quizzes.find(q => q.id === l.active.quizId);
        rec = { kind, lessonId, runId, quizId: quiz.id };
      } else {
        const e = db.exams.find(x => x.id === examId && x.groupId === s.groupId);
        if (!e || e.status !== "open") throw new AppError("closed");
        if (db.attempts.some(a => a.examId === examId && a.studentId === s.id)) throw new AppError("already");
        quiz = db.quizzes.find(q => q.id === e.quizId);
        rec = { kind, examId, quizId: quiz.id };
      }
      const clean = quiz.questions.map((_, i) => Number.isInteger(answers[i]) ? answers[i] : null);
      result = scoreAnswers(quiz, clean);
      db.attempts.push({ id: uid(), teacherId: s.teacherId, studentId: s.id, ...rec, answers: clean, ...result, at: Date.now() });
    });
    return result;
  }
  async studentSubmitExam(code, { examId, answers, texts }) {
    let result;
    this._mut(db => {
      const s = this._student(db, code); if (!s) throw new AppError("bad_code");
      const e = db.exams.find(x => x.id === examId && x.groupId === s.groupId);
      if (!e || e.status !== "open") throw new AppError("closed");
      if (db.attempts.some(a => a.examId === examId && a.studentId === s.id)) throw new AppError("already");
      const quiz = db.quizzes.find(q => q.id === e.quizId);
      const clean = quiz.questions.map((q, i) => !isOpenQ(q) && Number.isInteger(answers[i]) && answers[i] >= 0 && answers[i] < q.options.length ? answers[i] : null);
      const tx = quiz.questions.map((q, i) => isOpenQ(q) ? String((texts || [])[i] || "").trim().slice(0, 2000) : "");
      result = scoreAnswers(quiz, clean, []);
      db.attempts.push({ id: uid(), teacherId: s.teacherId, studentId: s.id, kind: "exam", examId, quizId: quiz.id, answers: clean, texts: tx, grades: [], ...result, at: Date.now() });
    });
    return result;
  }

  /* ---------- demo seeding ---------- */
  async resetAll() { lsDel(LS_KEY); lsDel(LS_SESSION); this.memory = null; this._write(emptyDB()); }
  async seedDemo(pack) {
    const email = "demo@edubbax.az";
    const db0 = this._read();
    const existing = db0.teachers.find(t => t.email === email);
    if (existing) { lsSet(LS_SESSION, existing.id); this._emit(); return strip(existing); }
    const t = await this.signUp({ name: pack.teacherName, email, password: "demo1234", subject: pack.subject });
    const g = await this.createGroup(pack.groupName);
    const g2 = await this.createGroup(pack.groupName2);
    const st = await this.addStudents(g.id, pack.names);
    await this.addStudents(g2.id, pack.names2);
    const quizzes = [];
    for (const q of pack.quizzes) quizzes.push(await this.saveQuiz(q));
    // a finished lesson that shows the loop: 33% → 92%
    const l = await this.createLesson({ title: pack.pastLesson, groupId: g.id, durationMin: 45, quizIds: [quizzes[0].id], autoLaunch: true, videoUrl: "" });
    const day = 24 * 3600 * 1000;
    const start = Date.now() - 2 * day;
    this._mut(db => {
      const L = db.lessons.find(x => x.id === l.id);
      const quiz = db.quizzes.find(x => x.id === quizzes[0].id);
      const r1 = uid(), r2 = uid();
      const mk = (runId, p, at) => st.forEach((s, i) => {
        const answers = quiz.questions.map((q, k) => ((i * 7 + k * 3) % 100) / 100 < p ? q.correct : pickWrong(q));
        db.attempts.push({ id: uid(), teacherId: t.id, studentId: s.id, kind: "lesson", lessonId: l.id, runId, quizId: quiz.id, answers, ...scoreAnswers(quiz, answers), at });
      });
      mk(r1, 0.33, start + 20 * 60000);
      mk(r2, 0.93, start + 30 * 60000);
      const u1 = understandingOf(db.attempts.filter(a => a.runId === r1));
      const u2 = understandingOf(db.attempts.filter(a => a.runId === r2));
      L.status = "ended"; L.startedAt = start; L.endedAt = start + 45 * 60000; L.mli = u1 < THRESHOLD && u2 >= THRESHOLD ? 1 : 0;
      L.runs = [
        { runId: r1, quizId: quiz.id, round: "measure", startedAt: start + 18 * 60000, closedAt: start + 20 * 60000, understanding: u1 },
        { runId: r2, quizId: quiz.id, round: "remeasure", startedAt: start + 28 * 60000, closedAt: start + 30 * 60000, understanding: u2 },
      ];
      db.presence[l.id] = Object.fromEntries(st.map(s => [s.id, { joinedAt: start + 60000, at: start + 44 * 60000, hand: false, name: s.name }]));
    });
    await this.createLesson({ title: pack.nextLesson, groupId: g.id, durationMin: 45, quizIds: [quizzes[1].id, quizzes[0].id], autoLaunch: true, videoUrl: "" });
    await this.createExam({ groupId: g.id, quizId: quizzes[1].id, title: pack.examTitle, timeLimitMin: 10 });
    return t;
  }
}

function pickWrong(q) { const w = q.options.map((_, i) => i).filter(i => i !== q.correct); return w[Math.floor(Math.random() * w.length)]; }
function strip(t) { return { id: t.id, name: t.name, email: t.email, subject: t.subject }; }
function pick(o, keys) { const r = {}; keys.forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; }
function historyRow(db, a) {
  const quiz = db.quizzes.find(q => q.id === a.quizId);
  let title = quiz ? quiz.title : "—", context = "";
  if (a.kind === "lesson") { const l = db.lessons.find(x => x.id === a.lessonId); context = l ? l.title : ""; const run = l && (l.runs || []).find(r => r.runId === a.runId); if (run) context += run.round === "remeasure" ? " · ↻" : ""; }
  else { const e = db.exams.find(x => x.id === a.examId); title = e ? e.title : title; }
  return { kind: a.kind, title, context, score: a.score, correctCount: a.correctCount, total: a.total, at: a.at };
}
function studentLessonView(db, lessonId, s) {
  const l = db.lessons.find(x => x.id === lessonId);

  if (l.active) {
    const quiz = db.quizzes.find(q => q.id === l.active.quizId);
    const mine = db.attempts.find(a => a.runId === l.active.runId && a.studentId === s.id);
    const reveal = l.active.status === "closed";
    active = {
      runId: l.active.runId, round: l.active.round, status: l.active.status, endsAt: l.active.endsAt, startedAt: l.active.startedAt,
      title: quiz ? quiz.title : "", questions: quiz ? publicQuestions(quiz, l.active.perm, reveal) : [],
      mine: mine ? { answers: mine.answers, score: mine.score, correctCount: mine.correctCount, total: mine.total } : null,
    };
  }
  const p = (db.presence[lessonId] || {})[s.id];
  const teacher = db.teachers.find(t => t.id === l.teacherId);
  return {
    lesson: { id: l.id, title: l.title, code: l.code, status: l.status, startedAt: l.startedAt, endedAt: l.endedAt, durationMin: l.durationMin, videoUrl: l.videoUrl, board: l.board },
    teacher: teacher ? teacher.name : "",
    active, hand: p ? !!p.hand : false,
    messages: db.messages.filter(m => m.lessonId === lessonId).slice(-80),
    myResults: db.attempts.filter(a => a.lessonId === lessonId && a.studentId === s.id).map(a => ({ score: a.score, round: ((l.runs || []).find(r => r.runId === a.runId) || {}).round, at: a.at })),
  };

class SupabaseBackend {
  constructor(cfg) {
    this.mode = "cloud";
    this.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true } });
    this.listeners = new Set();
    this.user = null;
    this.sb.auth.onAuthStateChange((_e, session) => { this.user = session ? session.user : null; this._emit(); });
    // live refresh: the UI asks for faster polling while a live room is open
    this.pollMs = 8000;
    const tick = () => { this._emit(); setTimeout(tick, this.pollMs); };
    setTimeout(tick, this.pollMs);
  }
  setPolling(ms) { this.pollMs = ms; }
  _emit() { queueMicrotask(() => this.listeners.forEach(cb => { try { cb(); } catch (e) { console.error(e); } })); }
  onChange(cb) { this.listeners.add(cb); return () => this.listeners.delete(cb); }
  _chk({ data, error }) { if (error) { const e = new AppError(error.code === "23505" ? "duplicate" : "server", error.message); throw e; } return data; }
  async _rpc(fn, args) {
    const { data, error } = await this.sb.rpc(fn, args);
    if (error) { const m = /EDX:([a-z_]+)/.exec(error.message || ""); throw new AppError(m ? m[1] : "server", error.message); }
    return data;
  }
  async _uid() { if (this.user) return this.user.id; const { data } = await this.sb.auth.getUser(); this.user = data.user; if (!this.user) throw new AppError("not_signed_in"); return this.user.id; }

  async session() {
    const { data } = await this.sb.auth.getSession();
    if (!data.session) return null;
    this.user = data.session.user;
    const row = this._chk(await this.sb.from("teachers").select("*").eq("id", this.user.id).maybeSingle());
    if (!row) {
      const meta = this.user.user_metadata || {};
      const t = { id: this.user.id, name: meta.name || this.user.email, email: this.user.email, subject: meta.subject || "" };
      this._chk(await this.sb.from("teachers").upsert(t));
      return t;
    }
    return { id: row.id, name: row.name, email: row.email, subject: row.subject };
  }
  async signUp({ name, email, password, subject }) {
    const { data, error } = await this.sb.auth.signUp({ email, password, options: { data: { name, subject } } });
    if (error) throw new AppError(/registered|exists/i.test(error.message) ? "email_taken" : (error.status === 429 || /rate limit|security purposes/i.test(error.message)) ? "email_rate" : "server", error.message);
    if (!data.session) throw new AppError("confirm_email");
    this.user = data.user;
    this._chk(await this.sb.from("teachers").upsert({ id: data.user.id, name, email, subject }));
    return { id: data.user.id, name, email, subject };
  }
  async signIn(email, password) {
    const { error } = await this.sb.auth.signInWithPassword({ email, password });
    if (error) throw new AppError(/confirm/i.test(error.message) ? "confirm_email" : "bad_credentials", error.message);
    return this.session();
  }
  async signOut() { await this.sb.auth.signOut(); this.user = null; this._emit(); }
  async updateProfile(patch) { const id = await this._uid(); this._chk(await this.sb.from("teachers").update(pick(patch, ["name", "subject"])).eq("id", id)); this._emit(); }

  async loadAll() {
    const id = await this._uid();
    const q = (t) => this.sb.from(t).select("*");
    const [teacher, groups, students, quizzes, lessons, exams, attempts] = await Promise.all([
      this.sb.from("teachers").select("*").eq("id", id).single(), q("groups"), q("students"), q("quizzes"), q("lessons"), q("exams"), q("attempts"),
    ]).then(rs => rs.map(r => this._chk(r)));
    let materials = [], payments = [];
    try { payments = this._chk(await this.sb.from("payments").select("*")); } catch (e) { console.warn("payments", e); }
    try { materials = this._chk(await this.sb.from("materials").select("id,title,topic,file_name,file_path,mime,size_bytes,created_at").order("created_at", { ascending: false })); } catch (e) { console.warn("materials", e); }
    const live = lessons.filter(l => l.status === "live").map(l => l.id);
    let messages = [], presence = {};
    if (live.length) {
      messages = this._chk(await this.sb.from("messages").select("*").in("lesson_id", live).order("at", { ascending: true }).limit(400));
      const pres = this._chk(await this.sb.from("presence").select("*").in("lesson_id", live));
      pres.forEach(p => { (presence[p.lesson_id] = presence[p.lesson_id] || {})[p.student_id] = { at: +new Date(p.last_seen), joinedAt: +new Date(p.joined_at), hand: p.hand, name: p.name }; });
    }
    return {
      teacher: { id: teacher.id, name: teacher.name, email: teacher.email, subject: teacher.subject },
      groups: groups.map(fromRow), students: students.map(fromRow), quizzes: quizzes.map(fromRow),
      lessons: lessons.map(fromRow), exams: exams.map(fromRow), attempts: attempts.map(fromRow),

  async createGroup(name) { const id = await this._uid(); const r = this._chk(await this.sb.from("groups").insert({ teacher_id: id, name }).select().single()); this._emit(); return fromRow(r); }
  async updateGroup(gid, patch) { this._chk(await this.sb.from("groups").update(pick(patch, ["name"])).eq("id", gid)); this._emit(); }

        if (!error) { created.push(fromRow(data)); break; }

    }
    this._emit();
    return created;
  }

  /* materials: file in private Storage bucket "materials/<teacher>/<uuid>.<ext>", extracted text in the table */
  async addMaterial(m) {
    const id = await this._uid();
    let path = null;
    if (m.file) {
      const ext = ((m.file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "") || "bin").slice(0, 5);
      path = `${id}/${uuid4()}.${ext}`;

      if (up.error) throw new AppError("upload", up.error.message);
    }
    const row = { teacher_id: id, title: m.title, topic: m.topic || "", file_name: m.file ? m.file.name.slice(0, 200) : "", file_path: path, mime: m.file ? (m.file.type || "").slice(0, 100) : "text/plain", size_bytes: m.file ? m.file.size : (m.content || "").length, content: (m.content || "").slice(0, 60000) };
    const r = await this.sb.from("materials").insert(row).select("id,title,topic,file_name,file_path,mime,size_bytes,created_at").single();

  async materialContent(mid) { const r = this._chk(await this.sb.from("materials").select("content").eq("id", mid).single()); return r.content || ""; }
  async materialFile(m) {

/* snake_case rows ⇄ camelCase objects */
function toCamel(k) { return k.replace(/_([a-z])/g, (_, c) => c.toUpperCase()); }
function toSnake(k) { return k.replace(/[A-Z]/g, c => "_" + c.toLowerCase()); }
const TIME_KEYS = new Set(["createdAt", "startedAt", "endedAt", "at", "updatedAt", "scheduledFor"]);
function fromRow(r) {
  const o = {};
  for (const [k, v] of Object.entries(r)) { const ck = toCamel(k); o[ck] = TIME_KEYS.has(ck) && v ? +new Date(v) : v; }
  if (o.timeLimit === undefined && r.time_limit !== undefined) o.timeLimit = r.time_limit;
  return o;
}
function toRow(p) {
  const o = {};
  for (const [k, v] of Object.entries(p)) o[toSnake(k)] = TIME_KEYS.has(k) && v ? new Date(v).toISOString() : v;
  return o;
}
function camel(v) {
  if (Array.isArray(v)) return v.map(camel);
  if (v && typeof v === "object") { const o = {}; for (const [k, x] of Object.entries(v)) o[toCamel(k)] = camel(x); return o; }
  return v;
}

const TEACHER_ROUTES = ["dash", "students", "pupil", "payments", "center", "levels", "paper", "materials", "plan", "quizzes", "quiz", "lessons", "lesson", "live", "exams", "exam", "profile"];
function parseHash() {
  const h = (location.hash || "").replace(/^#/, "");
  if (!h) return { route: "home", param: "" };
  const i = h.indexOf("-");
  if (i === -1) return { route: h, param: "" };
  return { route: h.slice(0, i), param: h.slice(i + 1) };
}
function go(route, param) {
  const h = "#" + route + (param ? "-" + param : "");
  if (location.hash === h) { onRoute(); return; }
  location.hash = h;
}
function onRoute() {
  const { route, param } = parseHash();
  const prev = S.route;
  S.route = route; S.param = param;
  S.ui.confirm = null; S.ui.menu = false;
  if (route !== "quiz") S.ui.quizDraft = null;
  if (prev !== route) { S.ui.lessonForm = false; S.ui.examForm = false; }
  if (api && api.setPolling) api.setPolling(route === "live" || route === "exam" ? 2500 : route === "dash" || route === "lessons" || route === "exams" ? 6000 : 15000);
  render();

async function routeLoad() {

  if (r === "center") await loadCenter();
}

/* ---------- data refresh ---------- */
let refreshing = false, refreshQueued = false;
async function refresh() {
  if (refreshing) { refreshQueued = true; return; }
  refreshing = true;

    S.teacher = t;

    if (["student", "slive", "sexam"].includes(S.route)) await loadStudent(true);
  } catch (e) { console.error(e); }
  refreshing = false;

  if (refreshQueued) { refreshQueued = false; refresh(); }
}

/* ---------- rendering ---------- */
function render(preserve) {
  const root = $("#app");
  if (!root) return;
  if (S.drawing) { S.pendingRender = true; return; }
  // keep what the person is typing when data refreshes underneath
  let keep = null;
  if (preserve) {
    keep = { vals: {}, focus: null, sel: null, scroll: {} };
    $$("input[id],textarea[id],select[id]", root).forEach(el => {
      if (el.type === "checkbox" || el.type === "radio") keep.vals[el.id] = { checked: el.checked };
      else if (el.type !== "file") keep.vals[el.id] = { value: el.value };
    });
    const a = document.activeElement;
    if (a && a.id && root.contains(a)) { keep.focus = a.id; try { keep.sel = [a.selectionStart, a.selectionEnd]; } catch (e) {} }
    $$("[data-scroll]", root).forEach(el => { keep.scroll[el.dataset.scroll] = { top: el.scrollTop, atEnd: el.scrollHeight - el.scrollTop - el.clientHeight < 30 }; });
  }
  const html = document.documentElement;
  html.lang = S.lang;
  html.dir = (LANGS.find(l => l.code === S.lang) || {}).rtl ? "rtl" : "ltr";
  root.innerHTML = shell();
  if (keep) {
    for (const [id, v] of Object.entries(keep.vals)) {
      const el = document.getElementById(id); if (!el || el.dataset.fresh || el.dataset.bind || el.dataset.plan || el.id === "ai-material" || el.dataset.action === "q-correct") continue; // state is the source of truth for bound fields
      if ("checked" in v) el.checked = v.checked; else el.value = v.value;
    }
    if (keep.focus) { const el = document.getElementById(keep.focus); if (el) { el.focus({ preventScroll: true }); if (keep.sel && el.setSelectionRange && keep.sel[0] != null) { try { el.setSelectionRange(keep.sel[0], keep.sel[1]); } catch (e) {} } } }
  }
  $$("[data-scroll]", root).forEach(el => {
    const k = keep && keep.scroll[el.dataset.scroll];
    if (!k || k.atEnd) el.scrollTop = el.scrollHeight; else el.scrollTop = k.top;
  });
  afterRender();
}

/* ---------- reusable pieces ---------- */
function pill(kind, text) { return `<span class="pill ${kind}">${text}</span>`; }
function statusPill(status) {
  if (status === "live") return `<span class="pill live"><i class="dot"></i>${tx("lesson.live")}</span>`;
  if (status === "ended") return pill("muted", tx("lesson.ended"));
  if (status === "open") return pill("good", tx("exam.open"));
  if (status === "closed") return pill("muted", tx("exam.closed"));
  return pill("info", tx("lesson.scheduled"));
}
function meter(v, label) {
  const k = tone(v);
  return `<div class="meter ${k}" role="img" aria-label="${esc(label || "")} ${pct(v)}"><div class="meter-track"><div class="meter-fill" style="width:${v == null ? 0 : Math.max(2, v)}%"></div><div class="meter-line" style="inset-inline-start:${THRESHOLD}%" title="${THRESHOLD}%"></div></div><b>${pct(v)}</b></div>`;
}
function kpi(label, value, sub, icon) { return `<div class="kpi"><div class="kpi-top">${icon ? I(icon) : ""}<span>${label}</span></div><div class="kpi-v">${value}</div>${sub ? `<div class="kpi-s">${sub}</div>` : ""}</div>`; }
function empty(icon, title, text, action) { return `<div class="empty">${I(icon, "big")}<h3>${title}</h3><p>${text}</p>${action || ""}</div>`; }
function confirmBtn(key, action, attrs, label, cls = "btn ghost sm danger") {
  if (S.ui.confirm === key) return `<span class="confirm"><span>${tx("common.sure")}</span><button class="btn sm danger-solid" data-action="${action}" ${attrs}>${tx("common.yes")}</button><button class="btn sm ghost" data-action="cancel-confirm">${tx("common.no")}</button></span>`;
  return `<button class="${cls}" data-action="ask-confirm" data-key="${esc(key)}">${label}</button>`;
}
function codeChip(code, big) { return `<button class="code-chip ${big ? "big" : ""}" data-action="copy" data-text="${esc(code)}" title="${tx("common.copy")}"><span>${esc(code)}</span>${I("copy")}</button>`; }
function avatar(name, cls = "") { return `<span class="av ${cls}">${esc(initials(name))}</span>`; }
function plannedSlots(lesson) {
  const n = (lesson.quizIds || []).length, D = lesson.durationMin || 45;
  return (lesson.quizIds || []).map((qid, i) => ({ slot: i, quizId: qid, atMin: Math.max(1, Math.round((D * (i + 1)) / n)) }));
}
function videoHost(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
function safeUrl(url) { try { const u = new URL(url); return /^https?:$/.test(u.protocol) ? u.href : ""; } catch (e) { return ""; } }

  </tbody></table></div>`;

/** Small bar chart of scores over time, threshold line at 65. */
function trendChart(rows) {
  const items = rows.slice(-16);
  const W = 640, H = 200, padL = 34, padB = 26, padT = 12, padR = 8;
  const bw = (W - padL - padR) / Math.max(items.length, 1);
  const y = v => padT + (H - padT - padB) * (1 - v / 100);
  const grid = [0, 50, 100].map(v => `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" class="g-grid"/><text x="${padL - 6}" y="${y(v) + 4}" class="g-lbl" text-anchor="end">${v}</text>`).join("");
  const bars = items.map((h, i) => {
    const x = padL + i * bw + bw * 0.18, w = bw * 0.64, top = y(h.score);
    return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${(y(0) - top).toFixed(1)}" rx="3" class="g-bar ${tone(h.score)}"><title>${esc(h.title)} · ${h.score}%</title></rect>`;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx("report.trend")}">${grid}<line x1="${padL}" x2="${W - padR}" y1="${y(THRESHOLD)}" y2="${y(THRESHOLD)}" class="g-th"/><text x="${W - padR}" y="${y(THRESHOLD) - 5}" class="g-lbl th" text-anchor="end">${THRESHOLD}%</text>${bars}</svg></div>`;
}

/* ---------- student payments (tracking only; no money moves through EdubbaX) ---------- */
function monthKey(d) { const x = d ? new Date(d) : new Date(); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-01`; }
const AZ_MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avqust", "sentyabr", "oktyabr", "noyabr", "dekabr"];
function monthLabel(k) { if (S.lang === "az") { const d = new Date(k + "T00:00:00"); return AZ_MONTHS[d.getMonth()] + " " + d.getFullYear(); } try { return new Intl.DateTimeFormat(locale(), { month: "long", year: "numeric" }).format(new Date(k + "T00:00:00")); } catch (e) { return k.slice(0, 7); } }
function money(v, cur) { try { return new Intl.NumberFormat(locale(), { style: "currency", currency: cur || "AZN", maximumFractionDigits: 2 }).format(Number(v) || 0); } catch (e) { return (Number(v) || 0).toFixed(2) + " " + (cur || "AZN"); } }
function reminderText(s, p) { return t("pay.reminderTpl", { name: s.name, month: monthLabel(p.period), amount: money(p.amount, p.currency), teacher: S.teacher.name }); }
function paymentsView() {
  const d = D();
  const f = S.ui.pay || (S.ui.pay = { month: monthKey(), group: "", amount: "", currency: "AZN" });
  const months = Array.from({ length: 7 }, (_, i) => { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() - 4 + i); return monthKey(x); });
  if (!months.includes(f.month)) months.push(f.month);
  const students = d.students.filter(s => !f.group || s.groupId === f.group).sort((a, b) => a.name.localeCompare(b.name));
  const pays = d.payments.filter(p => p.period === f.month);
  const rows = students.map(s => ({ s, p: pays.find(p => p.studentId === s.id) }));
  const due = rows.filter(r => r.p && r.p.status === "due"), paid = rows.filter(r => r.p && r.p.status === "paid");
  const sum = (list) => list.reduce((a, r) => a + Number(r.p.amount || 0), 0);
  const totalDueAll = d.payments.filter(p => p.status === "due").reduce((a, p) => a + Number(p.amount || 0), 0);
  const cur = f.currency || "AZN";
  return `${pageHead(tx("pay.title"), tx("pay.lead"))}
  <div class="panel notice">${I("calendar")}<div><b>${tx("pay.trackOnly")}</b><p class="small muted">${tx("pay.trackOnlyText")}</p></div></div>

    <label class="fld"><span>${tx("pay.month")}</span><select data-action="pay-f" data-k="month">${months.sort().map(m => `<option value="${m}" ${m === f.month ? "selected" : ""}>${esc(monthLabel(m))}</option>`).join("")}</select></label>
    <label class="fld"><span>${tx("common.group")}</span><select data-action="pay-f" data-k="group"><option value="">${tx("pay.allGroups")}</option>${d.groups.map(g => `<option value="${g.id}" ${g.id === f.group ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select></label>
    <label class="fld"><span>${tx("pay.default")}</span><div class="row gap-s"><input id="pay-amount" type="number" min="0" step="0.5" value="${esc(f.amount)}" placeholder="50" data-action="pay-f" data-k="amount"><select data-action="pay-f" data-k="currency">${["AZN", "USD", "EUR"].map(c => `<option ${c === cur ? "selected" : ""}>${c}</option>`).join("")}</select></div></label>
  </div><div class="row gap-s end"><button class="btn gold" data-action="pay-create" ${students.length ? "" : "disabled"}>${I("plus")}${tx("pay.create", { m: esc(monthLabel(f.month)) })}</button></div></div>
  <div class="kpis">
    ${kpi(tx("pay.dueN"), num(due.length), money(sum(due), cur), "clock")}
    ${kpi(tx("pay.paidN"), num(paid.length), money(sum(paid), cur), "check")}
    ${kpi(tx("pay.rate"), pct(due.length + paid.length ? Math.round(100 * paid.length / (due.length + paid.length)) : null), esc(monthLabel(f.month)), "target")}
    ${kpi(tx("pay.totalDue"), money(totalDueAll, cur), tx("pay.allMonths"), "calendar")}
  </div>
  <div class="panel"><div class="panel-h"><h3>${esc(monthLabel(f.month))}</h3>${due.length ? `<button class="btn outline sm" data-action="copy" data-text="${esc(due.map(r => reminderText(r.s, r.p)).join("\n\n"))}">${I("copy")}${tx("pay.copyAll", { n: num(due.length) })}</button>` : ""}</div>
    ${students.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${tx("common.name")}</th><th>${tx("common.group")}</th><th class="num">${tx("pay.amount")}</th><th>${tx("pay.status")}</th><th>${tx("pay.note")}</th><th></th></tr></thead><tbody>
    ${rows.map(({ s, p }) => `<tr data-row="pay"><td><a class="who" href="#pupil-${s.id}">${avatar(s.name)}${esc(s.name)}</a></td><td>${esc(groupName(s.groupId))}</td>
      ${p ? `<td class="num"><input type="number" min="0" step="0.5" value="${esc(p.amount)}" style="width:92px" data-action="pay-amt" data-id="${p.id}"> <span class="muted small">${esc(p.currency)}</span></td>
      <td>${p.status === "paid" ? `<button class="btn ghost sm" data-action="pay-toggle" data-id="${p.id}" data-v="due">${pill("good", tx("pay.paid"))}</button><div class="muted small">${p.paidAt ? fmtDate(p.paidAt) : ""}</div>` : `<button class="btn outline sm" data-action="pay-toggle" data-id="${p.id}" data-v="paid">${pill("warn", tx("pay.due"))} ${tx("pay.markPaid")}</button>`}</td>
      <td><input value="${esc(p.note || "")}" maxlength="200" data-action="pay-note" data-id="${p.id}" placeholder="—"></td>
      <td class="num">${p.status === "due" ? `<button class="icon-btn sm" data-action="copy" data-text="${esc(reminderText(s, p))}" title="${tx("pay.reminder")}" aria-label="${tx("pay.reminder")}">${I("chat")}</button>` : ""}${confirmBtn("pay-" + p.id, "pay-del", `data-id="${p.id}"`, I("trash"), "icon-btn sm")}</td>`

function teacherRating(r, w) {
  if (!r.lessons) return { value: null, enough: false };
  const parts = [["understanding", r.firstUnderstanding], ["score", r.avgScore], ["attendance", r.attendance], ["activity", r.lessons == null ? null : Math.min(100, r.lessons * 10)], ["mli", r.lessons ? Math.min(100, Math.round(100 * (r.mli || 0) / r.lessons)) : null]];

}
